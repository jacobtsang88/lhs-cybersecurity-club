/* pin the toggle above the panel while open */
#MENU_AS_CONTAINER_TOGGLE.archive-open{
  position:fixed !important;
  top:22px !important;right:18px !important;
  left:auto !important;bottom:auto !important;

<script id=archive-menu-js>
(function(){
  var t=document.getElementById('MENU_AS_CONTAINER_TOGGLE');
  var m=document.getElementById('MENU_AS_CONTAINER');
  if(!t||!m) return;

  m.classList.remove('sf-hidden','archive-open');
  m.removeAttribute('data-undisplayed');
  t.classList.remove('archive-open');
  document.body.style.overflow='';

  function set(open){
    m.classList.toggle('archive-open',open);
    t.classList.toggle('archive-open',open);
    t.setAttribute('aria-expanded',open?'true':'false');
    t.setAttribute('aria-label',open?'Close navigation menu':'Open navigation menu');
    document.body.style.overflow=open?'hidden':'';
  }
  set(false);

  t.addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();
    set(!m.classList.contains('archive-open'));
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') set(false);
  });
})();
</script><div id=archive-desktop-link style="text-align:center;padding:14px 0 22px;font:13px -apple-system,BlinkMacSystemFont,sans-serif;background:#0d1117;"><a href="../announcements.html?desktop=1" style="color:#8b98a5;">View desktop version</a></div>
